# VPS_SECRETS — пример файла секретов для GitHub Actions
#
# Создай GitHub Secret с именем VPS_SECRETS и вставь в него содержимое
# этого файла с реальными значениями (без комментариев и без кавычек вокруг строк).
#
# Формат: YAML, ключ: значение.
# Значения со спецсимволами (: # @ / etc.) заключай в двойные кавычки.
#
# КАК ДОБАВИТЬ СЕКРЕТ:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: VPS_SECRETS
#   Value: содержимое этого файла (с реальными значениями)

# ── Подключение к серверу ─────────────────────────────────────
VPS_HOST: "159.253.22.116"
SSH_USER: "root"

# ── Application ───────────────────────────────────────────────
ENV: prod
DEBUG: false
LOG_LEVEL: INFO

URL: "https://yourdomain.com"
DOMAIN_NAME: "yourdomain.com"
LETSENCRYPT_EMAIL: "admin@yourdomain.com"
SECRET_KEY: "change-me-strong-random-password-min-32-chars"
SECRET: "replace-with-generated-secret-minimum-32-characters"
ALGORITHM: RS256
ACCESS_TOKEN_EXPIRE_MINUTES: 4320
COOKIE_SECURE: true
SERVICE_API_KEY: "replace-with-generated-service-token-minimum-32-characters"
AI_SERVICE_API_KEY: "replace-with-generated-ai-service-token-minimum-32-characters"
SECRET: "replace-with-generated-secret-minimum-32-characters"

# ── Postgres ──────────────────────────────────────────────────
POSTGRES_DB: learn_db
POSTGRES_USER: learn_user
POSTGRES_PASSWORD: "change-me-strong-postgres-password"
DATABASE_URL: "postgresql+asyncpg://learn_user:change-me-strong-postgres-password@postgres:5432/learn_db"
USER_ADMIN_PASSWORD: "change-me-strong-admin-password"

# ── Redis ─────────────────────────────────────────────────────
REDIS_URL: "redis://redis:6379/0"
ARQ_REDIS_URL: "redis://redis:6379/0"

# ── LiteLLM ───────────────────────────────────────────────────
LITELLM_MASTER_KEY: "sk-change-me-strong-litellm-key"
UI_USERNAME: learn-admin
UI_PASSWORD: "change-me-strong-ui-password"
STORE_MODEL_IN_DB: "True"

# ── External AI APIs ──────────────────────────────────────────
OPENAI_API_KEY: "sk-proj-..."
ANTHROPIC_API_KEY: "sk-ant-api03-..."
DEEPSEEK_API_KEY: "sk-..."
DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
GEMINI_API_KEY: "AI..."

# ── Background tasks ──────────────────────────────────────────
MODERATION_CHECK_INTERVAL_MINUTES: 2
EMBEDDING_CHECK_INTERVAL_MINUTES: 10

# ── SMTP / Email relay (Postfix) ──────────────────────────────
SMTP_RELAYHOST: "[smtp.gmail.com]:587"
SMTP_SASL_PASSWD: "user@gmail.com:xxxx-xxxx-xxxx-xxxx"

# ── SMTP app settings ─────────────────────────────────────────
SMTP_HOST: smtp
SMTP_PORT: 587
SMTP_FROM_EMAIL: "noreply@yourdomain.com"
SMTP_USERNAME: ""
SMTP_PASSWORD: ""

# ── Telegram ─────────────────────────────────────────────────
TELEGRAM_BOT_TOKEN: "1234567890:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

GOOGLE_CLIENT_ID: "your-google-client-id"
GOOGLE_CLIENT_SECRET: "your-google-client-secret"
GOOGLE_REDIRECT_URI: "http://localhost:8050/en/users/google/callback"
SERVICE_API_KEY: "replace-with-generated-service-token-minimum-32-characters"
AI_SERVICE_API_KEY: "replace-with-generated-ai-service-token-minimum-32-characters"
ACCESS_TOKEN_EXPIRE_MINUTES: 4320