# LITELLM_CONFIG — шаблон YAML-секрета для GitHub Actions
#
# Заполни значения локально и сохрани полный YAML как GitHub Secret
# с именем LITELLM_CONFIG. Не коммить файл LITELLM_CONFIG.yml с реальными значениями.
#
# Workflow читает из YAML VPS_HOST/SSH_USER и формирует отдельный env-файл для
# LiteLLM. В контейнер передаются только LiteLLM/provider/Postgres переменные;
# остальные app/SMTP/Google secrets в этот контейнер не копируются.
#
# Добавить GitHub Secret:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: LITELLM_CONFIG
#   Value: полное содержимое этого файла с реальными значениями

# ── Подключение к серверу ─────────────────────────────────────
VPS_HOST: "2.31.21.148"
SSH_USER: "root"

# ── Application ───────────────────────────────────────────────
ENV: prod
DEBUG: false
LOG_LEVEL: INFO

URL: "https://yourdomain.com"
DOMAIN_NAME: "yourdomain.com"
LETSENCRYPT_EMAIL: "admin@yourdomain.com"
SECRET_KEY: "change-me-strong-random-password-min-32-chars"
SECRET: "replace-with-generated-secret-minimum-32-characters"
ALGORITHM: RS256
ACCESS_TOKEN_EXPIRE_MINUTES: 4320
COOKIE_SECURE: true
SERVICE_API_KEY: "replace-with-generated-service-token-minimum-32-characters"
AI_SERVICE_API_KEY: "replace-with-generated-ai-service-token-minimum-32-characters"

# ── Postgres ──────────────────────────────────────────────────
POSTGRES_DB: learn_db
POSTGRES_USER: learn_user
POSTGRES_PASSWORD: "change-me-strong-postgres-password"
DATABASE_URL: "postgresql+asyncpg://learn_user:change-me-strong-postgres-password@postgres:5432/learn_db"
USER_ADMIN_PASSWORD: "change-me-strong-admin-password"

# ── Redis ─────────────────────────────────────────────────────
REDIS_URL: "redis://redis:6379/0"
ARQ_REDIS_URL: "redis://redis:6379/0"

# ── LiteLLM ───────────────────────────────────────────────────
LITELLM_MASTER_KEY: "sk-change-me-strong-litellm-key"
# Необязательно: задай один раз и храни постоянно, если LiteLLM шифрует
# credentials, записанные через Admin UI.
LITELLM_SALT_KEY: "sk-change-me-strong-litellm-salt"
UI_USERNAME: learn-admin
UI_PASSWORD: "change-me-strong-ui-password"
STORE_MODEL_IN_DB: "True"

# ── External AI APIs ──────────────────────────────────────────
OPENAI_API_KEY: "sk-proj-..."
ANTHROPIC_API_KEY: "sk-ant-api03-..."
DEEPSEEK_API_KEY: "sk-..."
DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
GEMINI_API_KEY: "AI..."

# ── Background tasks ──────────────────────────────────────────
MODERATION_CHECK_INTERVAL_MINUTES: 2
EMBEDDING_CHECK_INTERVAL_MINUTES: 10

# ── SMTP / Email relay (Postfix) ──────────────────────────────
SMTP_RELAYHOST: "[smtp.gmail.com]:587"
SMTP_SASL_PASSWD: "user@gmail.com:xxxx-xxxx-xxxx-xxxx"

# ── SMTP app settings ─────────────────────────────────────────
SMTP_HOST: smtp
SMTP_PORT: 587
SMTP_FROM_EMAIL: "noreply@yourdomain.com"
SMTP_USERNAME: ""
SMTP_PASSWORD: ""

# ── Telegram ─────────────────────────────────────────────────
TELEGRAM_BOT_TOKEN: "1234567890:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

GOOGLE_CLIENT_ID: "your-google-client-id"
GOOGLE_CLIENT_SECRET: "your-google-client-secret"
GOOGLE_REDIRECT_URI: "http://localhost:8050/en/users/google/callback"
